<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio - AIと二人三脚で作るポートフォリオ</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1a4e 30%, #0d1b3e 60%, #0a0e27 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
            color: #ffffff;
            cursor: crosshair;
        }

        canvas#sparkles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .hero {
            text-align: center;
            z-index: 2;
            position: relative;
            padding: 2rem;
        }

        .hero-title {
            font-size: clamp(1.8rem, 5vw, 3.5rem);
            font-weight: 800;
            letter-spacing: 0.05em;
            line-height: 1.5;
            background: linear-gradient(90deg, #ffffff 0%, #a0c4ff 40%, #ffffff 60%, #bdb2ff 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: shimmer 4s ease-in-out infinite;
        }

        @keyframes shimmer {
            0%, 100% { background-position: 0% center; }
            50% { background-position: 200% center; }
        }

        .hero-sub {
            margin-top: 1.5rem;
            font-size: clamp(0.9rem, 2vw, 1.2rem);
            color: rgba(255, 255, 255, 0.6);
            font-weight: 300;
            letter-spacing: 0.15em;
        }

        .divider {
            width: 80px;
            height: 2px;
            background: linear-gradient(90deg, transparent, #a0c4ff, transparent);
            margin: 2rem auto;
            border-radius: 1px;
        }

        .hero-desc {
            max-width: 520px;
            margin: 0 auto;
            font-size: clamp(0.85rem, 1.5vw, 1rem);
            line-height: 2;
            color: rgba(255, 255, 255, 0.75);
            font-weight: 300;
        }

        /* Fortune Section */
        .fortune-section {
            margin-top: 2.5rem;
        }

        .fortune-label {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.5);
            letter-spacing: 0.12em;
            margin-bottom: 1rem;
        }

        .fortune-btn {
            position: relative;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.9rem 2.2rem;
            font-size: 1.05rem;
            font-weight: 600;
            font-family: inherit;
            color: #ffffff;
            background: linear-gradient(135deg, #6c5ce7, #a29bfe);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            overflow: hidden;
            transition: transform 0.2s, box-shadow 0.3s;
            box-shadow: 0 4px 24px rgba(108, 92, 231, 0.4);
            z-index: 2;
        }

        .fortune-btn:hover {
            transform: translateY(-2px) scale(1.04);
            box-shadow: 0 6px 32px rgba(108, 92, 231, 0.6);
        }

        .fortune-btn:active {
            transform: translateY(0) scale(0.97);
        }

        .fortune-btn .btn-icon {
            font-size: 1.3rem;
            display: inline-block;
            animation: wiggle 2s ease-in-out infinite;
        }

        @keyframes wiggle {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(12deg); }
            75% { transform: rotate(-12deg); }
        }

        .fortune-btn .btn-shine {
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.25), transparent);
            transition: none;
        }

        .fortune-btn:hover .btn-shine {
            animation: shine 0.6s ease forwards;
        }

        @keyframes shine {
            to { left: 100%; }
        }

        /* Result Card */
        .fortune-result {
            margin-top: 1.5rem;
            opacity: 0;
            transform: scale(0.5) translateY(20px);
            transition: opacity 0.4s, transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            pointer-events: none;
        }

        .fortune-result.visible {
            opacity: 1;
            transform: scale(1) translateY(0);
            pointer-events: auto;
        }

        .fortune-card {
            display: inline-block;
            padding: 1.2rem 2.5rem;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        .fortune-emoji {
            font-size: 2.5rem;
            display: block;
            margin-bottom: 0.4rem;
            animation: popIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes popIn {
            0% { transform: scale(0) rotate(-20deg); }
            60% { transform: scale(1.3) rotate(5deg); }
            100% { transform: scale(1) rotate(0deg); }
        }

        .fortune-rank {
            font-size: 1.6rem;
            font-weight: 800;
            letter-spacing: 0.08em;
        }

        .fortune-message {
            margin-top: 0.5rem;
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.65);
            font-weight: 300;
            line-height: 1.7;
        }

        /* Spinning animation while "drawing" fortune */
        .fortune-btn.spinning .btn-icon {
            animation: spin 0.5s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <canvas id="sparkles"></canvas>

    <div class="hero">
        <p class="hero-sub">— PORTFOLIO —</p>
        <h1 class="hero-title">AIと二人三脚で作る<br>ポートフォリオ</h1>
        <div class="divider"></div>
        <p class="hero-desc">
            テクノロジーと創造力を掛け合わせ、<br>
            まだ見ぬ可能性をカタチにする。
        </p>

        <div class="fortune-section">
            <p class="fortune-label">~ Today's Fortune ~</p>
            <button class="fortune-btn" onclick="drawFortune()">
                <span class="btn-shine"></span>
                <span class="btn-icon">🔮</span>
                今日の運勢を占う
            </button>
            <div class="fortune-result" id="fortuneResult">
                <div class="fortune-card">
                    <span class="fortune-emoji" id="fortuneEmoji"></span>
                    <span class="fortune-rank" id="fortuneRank"></span>
                    <p class="fortune-message" id="fortuneMessage"></p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('sparkles');
        const ctx = canvas.getContext('2d');
        let width, height;
        let mouse = { x: -1000, y: -1000 };
        const particles = [];
        const MAX_PARTICLES = 120;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        resize();
        window.addEventListener('resize', resize);

        document.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
            for (let i = 0; i < 3; i++) {
                spawnParticle(mouse.x, mouse.y);
            }
        });

        document.addEventListener('touchmove', (e) => {
            const touch = e.touches[0];
            mouse.x = touch.clientX;
            mouse.y = touch.clientY;
            for (let i = 0; i < 3; i++) {
                spawnParticle(mouse.x, mouse.y);
            }
        });

        function spawnParticle(x, y) {
            if (particles.length >= MAX_PARTICLES) return;
            const angle = Math.random() * Math.PI * 2;
            const speed = Math.random() * 2 + 0.5;
            const colors = [
                'rgba(160, 196, 255,',  // light blue
                'rgba(189, 178, 255,',  // lavender
                'rgba(255, 255, 255,',  // white
                'rgba(162, 210, 255,',  // sky
                'rgba(255, 214, 165,',  // warm gold
            ];
            particles.push({
                x: x + (Math.random() - 0.5) * 20,
                y: y + (Math.random() - 0.5) * 20,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed - 1,
                life: 1,
                decay: Math.random() * 0.015 + 0.008,
                size: Math.random() * 3 + 1,
                color: colors[Math.floor(Math.random() * colors.length)],
                rotation: Math.random() * Math.PI * 2,
                rotationSpeed: (Math.random() - 0.5) * 0.1,
            });
        }

        function drawStar(x, y, size, rotation, color, alpha) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(rotation);
            ctx.beginPath();
            for (let i = 0; i < 4; i++) {
                const a = (i / 4) * Math.PI * 2;
                ctx.moveTo(0, 0);
                ctx.lineTo(Math.cos(a) * size, Math.sin(a) * size);
            }
            ctx.strokeStyle = color + alpha + ')';
            ctx.lineWidth = 1;
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(0, 0, size * 0.3, 0, Math.PI * 2);
            ctx.fillStyle = color + alpha + ')';
            ctx.fill();

            ctx.restore();
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);

            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.01;
                p.life -= p.decay;
                p.rotation += p.rotationSpeed;

                if (p.life <= 0) {
                    particles.splice(i, 1);
                    continue;
                }

                const alpha = p.life;
                drawStar(p.x, p.y, p.size, p.rotation, p.color, alpha.toFixed(2));
            }

            requestAnimationFrame(animate);
        }

        animate();

        /* Fortune Logic */
        const fortunes = [
            {
                rank: '大吉',
                emoji: '🌟',
                color: '#ffd700',
                messages: [
                    '最高の一日になる予感！\n思い切った行動が吉。',
                    '何をやっても上手くいく日！\n新しいチャレンジに最適。',
                    'ツキが絶好調！\n直感を信じて進もう。',
                ],
            },
            {
                rank: '中吉',
                emoji: '✨',
                color: '#a0c4ff',
                messages: [
                    'いい流れが来ています！\n丁寧に過ごすと◎',
                    '小さな幸せがたくさん！\n周りへの感謝を忘れずに。',
                    '穏やかな良い日。\n笑顔でいると運気UP！',
                ],
            },
            {
                rank: '小吉',
                emoji: '🍀',
                color: '#77dd77',
                messages: [
                    'ほんのり良いことが。\nいつもより少し優しくなれる日。',
                    'コツコツが実を結ぶ日。\n焦らず着実に。',
                    '地道な努力が報われそう。\n自分を褒めてあげて。',
                ],
            },
            {
                rank: '吉',
                emoji: '🌸',
                color: '#f8b4c8',
                messages: [
                    '平和で穏やかな一日。\nリラックスを大切に。',
                    '普通が一番の幸せ。\nゆったり過ごして吉。',
                    '安定した運勢。\n好きなことに時間を使おう。',
                ],
            },
            {
                rank: '末吉',
                emoji: '🌱',
                color: '#b4d7a8',
                messages: [
                    '未来に向けた種まきの日。\n今日の努力が後で花開く。',
                    'じわじわ運気上昇中！\n焦らないのがポイント。',
                    '小さな一歩を大切に。\n明日はもっと良くなる！',
                ],
            },
            {
                rank: '大凶…？',
                emoji: '🐱',
                color: '#e0aaff',
                messages: [
                    '…なんてウソ！\n猫に癒されて今日もハッピー♪',
                    '…と見せかけて逆転の日！\nピンチはチャンス。',
                    '…ドンマイ！\nおいしいものを食べれば全部OK。',
                ],
            },
        ];

        function drawFortune() {
            const btn = document.querySelector('.fortune-btn');
            const result = document.getElementById('fortuneResult');

            // Hide previous result & spin
            result.classList.remove('visible');
            btn.classList.add('spinning');

            setTimeout(() => {
                const fortune = fortunes[Math.floor(Math.random() * fortunes.length)];
                const msg = fortune.messages[Math.floor(Math.random() * fortune.messages.length)];

                document.getElementById('fortuneEmoji').textContent = fortune.emoji;
                const rankEl = document.getElementById('fortuneRank');
                rankEl.textContent = fortune.rank;
                rankEl.style.color = fortune.color;
                document.getElementById('fortuneMessage').textContent = msg;

                // Re-trigger pop animation on emoji
                const emojiEl = document.getElementById('fortuneEmoji');
                emojiEl.style.animation = 'none';
                emojiEl.offsetHeight; // reflow
                emojiEl.style.animation = '';

                btn.classList.remove('spinning');
                result.classList.add('visible');

                // Burst sparkles from button position
                const rect = btn.getBoundingClientRect();
                const cx = rect.left + rect.width / 2;
                const cy = rect.top + rect.height / 2;
                for (let i = 0; i < 20; i++) {
                    spawnParticle(cx, cy);
                }
            }, 600);
        }
    </script>
</body>
</html>
